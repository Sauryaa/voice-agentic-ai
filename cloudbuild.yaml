substitutions:
  _SERVICE_NAME: voice-agentic-ai
  _REGION: us-central1
  _REPOSITORY: voice-agentic-ai
  _CORS_ORIGINS: "*"
  _RUNTIME_SERVICE_ACCOUNT: ""
  _RECAPTCHA_SITE_KEY: ""
  _RECAPTCHA_EXPECTED_ACTION: "start_interview"
  _RECAPTCHA_MIN_SCORE: "0.5"
  _SILENCE_TIMEOUT_SECONDS: "1.5"
  _MAX_RECORDING_SECONDS: "900"
  _QUESTION_BANK_PATH: "data/headache_questions-ForVoicePrototyping.xlsx"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-t",
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA",
        "."
      ]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        runtime_service_account="${_RUNTIME_SERVICE_ACCOUNT:-voice-agentic-ai-runner@$PROJECT_ID.iam.gserviceaccount.com}"
        deploy_args=(
          run deploy "${_SERVICE_NAME}"
          --image "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA"
          --region "${_REGION}"
          --platform managed
          --allow-unauthenticated
          --set-env-vars "GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION},CORS_ORIGINS=${_CORS_ORIGINS},SILENCE_TIMEOUT_SECONDS=${_SILENCE_TIMEOUT_SECONDS},MAX_RECORDING_SECONDS=${_MAX_RECORDING_SECONDS},QUESTION_BANK_PATH=${_QUESTION_BANK_PATH},RECAPTCHA_SITE_KEY=${_RECAPTCHA_SITE_KEY},RECAPTCHA_EXPECTED_ACTION=${_RECAPTCHA_EXPECTED_ACTION},RECAPTCHA_MIN_SCORE=${_RECAPTCHA_MIN_SCORE}"
          --service-account "${runtime_service_account}"
        )

        gcloud "${deploy_args[@]}"

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA"
